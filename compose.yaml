services:
  db:
    image: postgres:18
    container_name: solven-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solven}
      POSTGRES_DB: ${POSTGRES_DB:-solven}
    ports:
      - "5432:5432"
    volumes:
      - datos_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_pg:
    name: solven-db
